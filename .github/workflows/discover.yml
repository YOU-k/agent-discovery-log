name: Daily Discovery

on:
  schedule:
    # 05:37 Beijing = 21:37 UTC previous day.
    # Off the top of the hour and off 22:00 UTC — both are GitHub's peak
    # cron windows where runs get delayed 30+ min or dropped entirely
    # (dropped run on 2026-08-27 22:00 UTC = no Feishu card that morning).
    - cron: "37 21 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: discover
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps (optional Claude scoring)
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            pip install --quiet anthropic
          else
            echo "ANTHROPIC_API_KEY not set — running without LLM scoring"
          fi
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      # 先自检再跑。流水线挂了的表现是「第二天没收到飞书卡片」，
      # 等发现已经晚一天；这一步 10 秒，挡住渲染/解析类的低级错误。
      - name: Self-check (offline)
        run: python3 scripts/test_pipeline.py

      - name: Run discovery
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 scripts/discover.py

      - name: Render viz
        run: python3 scripts/render_viz.py

      - name: Notify (Feishu)
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
          FEISHU_KEYWORD: ${{ vars.FEISHU_KEYWORD }}
        run: python3 scripts/notify.py

      - name: Commit findings
        run: |
          git config user.name "discovery-bot"
          git config user.email "discovery-bot@users.noreply.github.com"
          git add discoveries/ state/ docs/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Daily discovery $(date -u +%Y-%m-%d)"
            git push
          fi
